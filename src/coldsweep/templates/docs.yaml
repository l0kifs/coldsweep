# docs -- a BUDGET-BOUNDED profile, but not a hopeless one.
#
# Every rule here is decided by an agent, so nothing in this profile forces the gate to close.
# It does not follow that it never closes: measured end to end on the coldsweep repository, the
# new-finding rate decayed 8 -> 6 -> 2 -> 1 across four rounds rather than plateauing, because a
# document is a closed target -- "this symbol has no entry" runs out of symbols in a way
# "this code could fail here" does not. What held the gate shut at round 4 was 2 unadjudicated
# disputes and 3 open findings, not a supply of new ones.
#
# So budget more rounds here than for `issues`, and expect `coldsweep adjudicate` to be what
# actually finishes the task. A non-zero exit from `coldsweep run` is still the common ending.
# Move a rule to a deterministic check and mark it `decided_by: code` to bring it into the
# convergent half. Full numbers: docs/measurements.md.
version: 1
name: docs
scope:
  include: ["docs/**/*.md", "*.md"]
  exclude: [".coldsweep/**", "CHANGELOG.md"]
files_per_shard: 1
convergence:
  k: 2
  max_rounds: 8
models:
  scan: sonnet
  fix: sonnet
  scan_alt: null
  adjudicate: sonnet
agent:
  command: ["claude", "-p", "--output-format", "json"]
  scan_tools: ["Read", "Grep", "Glob"]
  fix_tools: ["Read", "Grep", "Glob", "Edit", "Write"]
  permission_mode: acceptEdits
  parallelism: 4
  retries: 2
  timeout_s: 900
  extra_args: []
  append_flags: true
rules:
  - id: undocumented-public-symbol
    mode: presence
    description: >-
      A public symbol the document is responsible for describing has no entry, or has an entry
      that only restates its name or signature without saying what it does or when to use it.
  - id: missing-usage-example
    mode: presence
    description: >-
      A documented capability has no runnable example, or has an example that is a placeholder
      rather than a command or snippet the reader can actually run.
  - id: stale-reference
    mode: absence
    description: >-
      The document names a file, flag, command or symbol that does not exist in the repository
      as written.
mechanical: []
